services:
  diversolab_app_web_deploy:
    image: diversolab_app:latest
    container_name: diversolab_app_web_deploy
    env_file:
    - ./.env.deploy
    ports:
    - 5125:5000
    depends_on:
      diversolab_app_db_deploy:
        condition: service_healthy
    networks:
    - splent_network
    command:
    - bash
    - -c
    - bash /workspace/diversolab_app/entrypoints/entrypoint.prod.sh
  diversolab_app_db_deploy:
    image: mariadb:11.4
    container_name: diversolab_app_db_deploy
    env_file:
    - ./.env.deploy
    command: --default-authentication-plugin=mysql_native_password
    ports:
    - 33185:3306
    volumes:
    - diversolab_app_db_deploy_data:/var/lib/mysql
    healthcheck:
      test:
      - CMD-SHELL
      - mariadb -u$${MARIADB_USER} -p$${MARIADB_PASSWORD} -e 'SELECT 1'
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
    - splent_network
  splent_feature_nginx:
    build:
      context: features/splent_feature_nginx
      dockerfile: Dockerfile.prod
    image: splent/splent_feature_nginx:latest
    restart: always
    ports:
    - ${NGINX_HTTP_HOST_PORT}:80
    - ${NGINX_HTTPS_HOST_PORT}:443
    volumes:
    - letsencrypt:/etc/letsencrypt:ro
    - certbot_webroot:/var/www/certbot:ro
    - /Users/davidromeroorganvidez/Desktop/splent_workspace/diversolab_app/docker/features/splent_feature_nginx/nginx/locations:/etc/nginx/conf.d/locations:ro
    environment:
    - NGINX_UPSTREAM_HOST=${NGINX_UPSTREAM_HOST}
    - NGINX_UPSTREAM_PORT=${NGINX_UPSTREAM_PORT}
    - NGINX_SERVER_NAME=${NGINX_SERVER_NAME}
    - NGINX_TRUSTED_PROXY_CIDRS=${NGINX_TRUSTED_PROXY_CIDRS:-}
    networks:
    - splent_network
  splent_feature_redis:
    image: redis:7.4
    restart: always
    ports:
    - ${REDIS_HOST_PORT}:6379
    networks:
    - splent_network
volumes:
  diversolab_app_db_deploy_data: null
  letsencrypt: null
  certbot_webroot: null
networks:
  splent_network:
    external: true
    name: ${SPLENT_NETWORK:-splent_network}
