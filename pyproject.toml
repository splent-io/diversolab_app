[build-system]
requires = [
    "setuptools>=80.3.1",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "diversolab_app"
version = "0.0.1"
description = "diversolab_app is an app built with SPLENT (https://www.splent.io)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "watchdog",
]
core = [
    "splent_framework",
]

[tool.splent]
cli_version = "1.21.1"
features = [
    "splent_io/splent_feature_auth@v1.10.4",
    "splent_io/splent_feature_settings@v0.3.1",
    "splent_io/splent_feature_admin@v1.4.0",
    "splent_io/splent_feature_projects@v0.2.3",
    "splent_io/splent_feature_public@v1.7.3",
    "splent_io/splent_feature_session_redis@v1.1.2",
    "splent_io/splent_feature_cloudflare@v0.1.2",
    "splent_io/splent_feature_mail@v1.4.2",
    "splent_io/splent_feature_nginx@v1.2.0",
    "splent_io/splent_feature_wordpress_import@v0.1.0",
    "splent_io/splent_feature_comments@v0.1.2",
    "splent_io/splent_feature_contact@v0.1.2",
    "splent_io/splent_feature_slider@v0.3.0",
    "splent_io/splent_feature_skin_academic@v0.2.2",
    "splent_io/splent_feature_redis@v1.5.7",
    "splent_io/splent_feature_theme@v0.7.1",
    "splent_io/splent_feature_post@v0.4.0",
    "splent_io/splent_feature_partners@v0.3.1",
    "splent_io/splent_feature_legal@v0.1.1",
    "splent_io/splent_feature_team@v0.3.1",
    "splent_io/splent_feature_tools@v0.3.1",
    "splent_io/splent_feature_research_projects@v0.3.1",
    "splent_io/splent_feature_media@v0.7.0",
    "splent_io/splent_feature_about@v0.2.1",
]
features_dev = []
features_prod = []
spl = "cms_spl"

[tool.splent.layout]
base_template = "base_template.html"
hooks = [
    "layout.head.css",
    "layout.sidebar.top",
    "layout.anonymous_sidebar",
    "layout.authenticated_sidebar",
    "layout.sidebar.authenticated.items",
    "layout.navbar.anonymous",
    "layout.navbar.authenticated",
    "layout.footer",
    "layout.scripts",
]

[tool.splent.spl_model]
mirror = "uvlhub.io"
doi = "10.5281/zenodo.21916291"
concept_doi = ""
version = ""
file = "cms_spl.uvl"

[tool.splent.config]
POST_NAV_LABEL = "News"
POST_INDEX_PATH = "/news"
SITE_BRAND_MODE = "logo"
SITE_LOGO_SIZE = "80"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = [
    "src",
]
